name: Build Aphernix Forge Mod

on:
  push:
    branches:
      - build/aphernix-forge-1201-20260801
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Prepare resources
        working-directory: aphernix-ci
        run: |
          bash setup-resources.sh
          bash setup-extra-resources.sh
      - name: Apply armor and transformation update
        run: |
          cat ci/aphernix_armor_transform_overlay.part1 ci/aphernix_armor_transform_overlay.part2 ci/aphernix_armor_transform_overlay.part3 ci/aphernix_armor_transform_overlay.part4 | base64 -d > /tmp/aphernix-overlay.zip
          unzip -o /tmp/aphernix-overlay.zip -d aphernix-ci
      - name: Apply Yusufte update
        run: |
          cat ci/yusufte_delta.part00 ci/yusufte_delta.part01 ci/yusufte_delta.part02 ci/yusufte_delta.part03 ci/yusufte_delta.part04 | base64 -d > /tmp/yusufte-delta.zip
          unzip -o /tmp/yusufte-delta.zip -d aphernix-ci
      - name: Apply Olds compatibility hotfix
        run: |
          cat ci/olds_hotfix.part00 ci/olds_hotfix.part01 ci/olds_hotfix.part02 ci/olds_hotfix.part03 | base64 -d > /tmp/olds-hotfix.zip
          unzip -o /tmp/olds-hotfix.zip -d aphernix-ci
      - name: Apply Yusufte chicken transformation
        run: |
          cp aphernix-ci/src/main/resources/assets/aphernix/lang/tr_tr.json /tmp/aphernix-tr.json
          cp aphernix-ci/src/main/resources/assets/aphernix/lang/en_us.json /tmp/aphernix-en.json
          cat ci/yusufte_chicken_overlay.part00 ci/yusufte_chicken_overlay.part01 | base64 -d > /tmp/yusufte-chicken-overlay.zip
          unzip -o /tmp/yusufte-chicken-overlay.zip -d aphernix-ci
          cp /tmp/aphernix-tr.json aphernix-ci/src/main/resources/assets/aphernix/lang/tr_tr.json
          cp /tmp/aphernix-en.json aphernix-ci/src/main/resources/assets/aphernix/lang/en_us.json
          python - <<'PY'
          import json
          from pathlib import Path
          values={'tr_tr.json':'Yusufte Tavuk Hali','en_us.json':'Yusufte Chicken Form'}
          root=Path('aphernix-ci/src/main/resources/assets/aphernix/lang')
          for filename,value in values.items():
              path=root/filename; data=json.loads(path.read_text(encoding='utf-8')); data['entity.aphernix.yusufte_chicken']=value; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          sed -i 's/mod_version=1.3.0/mod_version=1.4.0/' aphernix-ci/gradle.properties
      - name: Make Yusufte fear large animals only
        run: |
          base64 -d ci/yusufte_big_animals_hotfix.b64 > /tmp/yusufte-big-animals-hotfix.zip
          unzip -o /tmp/yusufte-big-animals-hotfix.zip -d aphernix-ci
          sed -i 's/mod_version=1.4.0/mod_version=1.4.1/' aphernix-ci/gradle.properties
      - name: Fix Yusufte chicken initialization
        run: |
          base64 -d ci/aphernix_initfix.part00 > /tmp/aphernix-initfix.zip
          unzip -o /tmp/aphernix-initfix.zip -d aphernix-ci
          base64 -d ci/aphernix_initfix_compile_hotfix.b64 > /tmp/aphernix-initfix-compile-hotfix.zip
          unzip -o /tmp/aphernix-initfix-compile-hotfix.zip -d aphernix-ci
          sed -i 's/mod_version=1.4.1/mod_version=1.4.2/' aphernix-ci/gradle.properties
      - name: Fix Yusufte chicken gravity attributes
        run: |
          FILE=aphernix-ci/src/main/java/com/ege/aphernix/entity/YusufteChickenEntity.java
          sed -i 's/AttributeSupplier\.builder()/net.minecraft.world.entity.Mob.createMobAttributes()/g' "$FILE"
          sed -i 's/mod_version=1.4.2/mod_version=1.4.3/' aphernix-ci/gradle.properties
      - name: Separate Aphernix and Yusufte bite forms
        run: |
          base64 -di ci/yusufte_separate_forms.b64 > /tmp/yusufte-separate.zip
          unzip -o /tmp/yusufte-separate.zip -d aphernix-ci
          python - <<'PY'
          import json
          from pathlib import Path
          additions={'tr_tr.json':{'entity.aphernix.yusufte_diamond':'Yusufte Elmas Bite Hali','entity.aphernix.yusufte_old':'Yusufte Olds Bite Hali'},'en_us.json':{'entity.aphernix.yusufte_diamond':'Yusufte Diamond Bite Form','entity.aphernix.yusufte_old':'Yusufte Olds Bite Form'}}
          root=Path('aphernix-ci/src/main/resources/assets/aphernix/lang')
          for filename,vals in additions.items():
              p=root/filename; d=json.loads(p.read_text(encoding='utf-8')); d.update(vals); p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          sed -i 's/mod_version=1.4.3/mod_version=1.4.4/' aphernix-ci/gradle.properties
      - name: Build mod
        working-directory: aphernix-ci
        run: gradle --no-daemon build
      - name: Collect JAR
        run: |
          mkdir artifact
          cp aphernix-ci/build/libs/aphernix-1.4.4.jar artifact/apherniixmod-FIXED-1.4.4.jar
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: apherniixmod-FIXED-1.4.4
          path: artifact/apherniixmod-FIXED-1.4.4.jar
          if-no-files-found: error
