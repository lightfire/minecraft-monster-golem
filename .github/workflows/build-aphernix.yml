name: Build Aphernix Forge Mod

on:
  push:
    branches:
      - build/aphernix-forge-1201-20260801
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Prepare resources
        working-directory: aphernix-ci
        run: bash setup-resources.sh
      - name: Build mod
        working-directory: aphernix-ci
        run: gradle --no-daemon build
      - name: Collect JAR
        run: |
          mkdir artifact
          cp aphernix-ci/build/libs/aphernix-1.0.0.jar artifact/Aphernix-1.20.1-Forge.jar
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Aphernix-1.20.1-Forge
          path: artifact/Aphernix-1.20.1-Forge.jar
          if-no-files-found: error
