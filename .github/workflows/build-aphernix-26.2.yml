name: Build Aphernix Forge 26.2

on:
  push:
    branches:
      - build/aphernix-forge-1201-20260801
    paths:
      - 'ci/aphernix262-src/**'
      - '.github/workflows/build-aphernix-26.2.yml'
  workflow_dispatch:

concurrency:
  group: aphernix-forge-26-2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download Forge 26.2 MDK
        run: |
          curl -L --fail -o /tmp/forge-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/26.2-65.1.0/forge-26.2-65.1.0-mdk.zip
          rm -rf aphernix-26.2
          mkdir aphernix-26.2
          unzip -q /tmp/forge-mdk.zip -d aphernix-26.2
          chmod +x aphernix-26.2/gradlew

      - name: Install Aphernix sources
        run: |
          rm -rf aphernix-26.2/src/main/java
          mkdir -p aphernix-26.2/src/main/java
          cp -R ci/aphernix262-src/src/main/. aphernix-26.2/src/main/
          sed -i "s/version = '1.0.0'/version = '2.0.0'/" aphernix-26.2/build.gradle
          sed -i "s/group = 'com.example.examplemod'/group = 'com.ege.aphernix'/" aphernix-26.2/build.gradle
          sed -i 's/examplemod/aphernix/g' aphernix-26.2/build.gradle

      - name: Build mod
        working-directory: aphernix-26.2
        run: ./gradlew --no-daemon build

      - name: Collect JAR
        run: |
          mkdir -p artifact
          JAR=$(find aphernix-26.2/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n 1)
          cp "$JAR" artifact/apherniixmod-26.2-2.0.0.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: apherniixmod-26.2-2.0.0
          path: artifact/apherniixmod-26.2-2.0.0.jar
          if-no-files-found: error
